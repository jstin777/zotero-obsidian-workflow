name: Template checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py
      - run: python tools/workflow.py init --demo
      - run: python tools/workflow.py doctor
      - run: python tools/workflow.py sync
      - run: python tools/workflow.py sync
      - run: node tests/test_plugin.cjs
